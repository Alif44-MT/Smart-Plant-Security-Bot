<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="botBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="1" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" rx="16" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#f5f3ff">Smart Plant Security Bot</text>

  <!-- Green field inside the track -->
  <rect x="100" y="70" width="600" height="310" rx="8" fill="url(#field)"/>

  <!-- Black line track -->
  <path d="M100 70 H700 V380 H100 Z" fill="none" stroke="#1e293b" stroke-width="16" stroke-linejoin="round"/>

  <!-- PIR coverage area -->
  <circle cx="420" cy="240" r="135" fill="#ef4444" fill-opacity="0.06" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Plants (bigger) -->
  <g transform="translate(350 215) scale(1.5)">
    <circle cx="-15" cy="-15" r="14" fill="#16a34a"/>
    <circle cx="15" cy="-15" r="14" fill="#16a34a"/>
    <circle cx="0" cy="-28" r="16" fill="#22c55e"/>
    <rect x="-15" y="5" width="30" height="20" rx="3" fill="#92400e"/>
  </g>
  <g transform="translate(450 200) scale(1.5)">
    <circle cx="-15" cy="-15" r="14" fill="#16a34a"/>
    <circle cx="15" cy="-15" r="14" fill="#16a34a"/>
    <circle cx="0" cy="-28" r="16" fill="#22c55e"/>
    <rect x="-15" y="5" width="30" height="20" rx="3" fill="#92400e"/>
  </g>
  <g transform="translate(400 300) scale(1.5)">
    <circle cx="-15" cy="-15" r="14" fill="#16a34a"/>
    <circle cx="15" cy="-15" r="14" fill="#16a34a"/>
    <circle cx="0" cy="-28" r="16" fill="#22c55e"/>
    <rect x="-15" y="5" width="30" height="20" rx="3" fill="#92400e"/>
  </g>

  <!-- Obstacle on the line -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.12;0.44;0.46;1" dur="18s" repeatCount="indefinite"/>
    <ellipse cx="300" cy="64" rx="18" ry="14" fill="#a8a29e" stroke="#57534e" stroke-width="2"/>
    <ellipse cx="295" cy="59" rx="5" ry="3" fill="#e7e5e4"/>
  </g>

  <!-- Intruder attacking the plants: PIR pulse -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.92;0.95;1" dur="18s" repeatCount="indefinite"/>
    <circle cx="500" cy="300" r="8" fill="none" stroke="#f87171" stroke-width="3">
      <animate attributeName="r" values="8;50" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="262" r="11" fill="#fb923c"/>
    <rect x="487" y="276" width="26" height="38" rx="8" fill="#fb923c"/>
  </g>

  <!-- SMS alert -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.62;0.66;0.92;0.95;1" dur="18s" repeatCount="indefinite"/>
    <rect x="540" y="118" width="150" height="34" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
    <text x="615" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">SMS: Intruder alert!</text>
  </g>

  <!-- Robot: follows the line, stops at obstacle, resumes -->
  <g>
    <animateMotion dur="18s" repeatCount="indefinite" rotate="auto" path="M100 70 H700 V380 H100 Z" keyPoints="0;0.085;0.085;1" keyTimes="0;0.25;0.45;1" calcMode="linear"/>

    <!-- 360° ultrasonic scan -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <path d="M0 0 L0 -64 A64 64 0 0 1 64 0 Z" fill="#67e8f9" opacity="0.4"/>
    </g>

    <!-- Wheels -->
    <rect x="-16" y="-24" width="30" height="9" rx="4" fill="#0f172a"/>
    <rect x="-16" y="15" width="30" height="9" rx="4" fill="#0f172a"/>

    <!-- Body -->
    <rect x="-20" y="-15" width="40" height="30" rx="9" fill="url(#botBody)" stroke="#4c0519" stroke-width="1.5"/>

    <!-- Eyes -->
    <circle cx="13" cy="-6" r="3.5" fill="#ffffff"/>
    <circle cx="14" cy="-6" r="1.8" fill="#0f172a"/>
    <circle cx="13" cy="6" r="3.5" fill="#ffffff"/>
    <circle cx="14" cy="6" r="1.8" fill="#0f172a"/>

    <!-- Ultrasonic sensor dome -->
    <circle cx="0" cy="0" r="7" fill="#f59e0b" stroke="#78350f" stroke-width="1.5"/>
    <circle cx="-2" cy="-2" r="2.5" fill="#fef3c7"/>
  </g>

  <!-- I2C LCD status display -->
  <text x="60" y="400" font-family="Arial, sans-serif" font-size="11" fill="#c4b5fd">I2C LCD</text>
  <rect x="60" y="406" width="270" height="40" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="75" y="431" font-family="Courier New, monospace" font-size="15" fill="#bbf7d0">
    <animate attributeName="opacity" values="1;0;1;0;1;1" keyTimes="0;0.25;0.45;0.6;0.95;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
    &gt; Patrolling line
  </text>
  <text x="75" y="431" font-family="Courier New, monospace" font-size="15" fill="#fde047">
    <animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.25;0.45;0.6;0.95;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
    &gt; Obstacle! Stopping
  </text>
  <text x="75" y="431" font-family="Courier New, monospace" font-size="15" fill="#fca5a5">
    <animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.25;0.45;0.6;0.95;1" calcMode="discrete" dur="18s" repeatCount="indefinite"/>
    &gt; Intruder! SMS sent
  </text>

  <!-- Legend -->
  <text x="350" y="418" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">Ultrasonic sensor: 360° obstacle scan</text>
  <text x="350" y="434" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">PIR sensor: intruder detection</text>
  <text x="350" y="450" font-family="Arial, sans-serif" font-size="13" fill="#e2e8f0">GSM module: SMS alert</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
